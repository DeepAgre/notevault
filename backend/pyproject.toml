[project]
name = "notevault-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi",
  "uvicorn",
  "sqlalchemy",
  "psycopg2-binary",
  "python-dotenv",
  "python-jose",
  "bcrypt==4.0.1",
  "python-multipart",
  "email-validator",
  "requests",
  "scikit-learn",
  "joblib",
  "pandas",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]